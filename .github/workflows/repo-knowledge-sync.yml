name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Triggers via workflow_run on "Verify Setup" completion rather than re-running its jobs
# directly, since that workflow's "test-build" job (Gradle assembleDebug for sample-app) only
# runs on push to main, not on every PR -- consuming its real result preserves that distinction
# instead of unconditionally re-building here.
#   - test.status  <- the "verify" job (bash syntax check + ShellCheck), runs on every trigger.
#   - build.status <- the "test-build" job (sample-app APK build); only exists for push-to-main
#     runs, so it's absent (left alone, not guessed) for PR-triggered "Verify Setup" runs.

on:
  workflow_run:
    workflows: ["Verify Setup"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Restore branch name after exact-SHA checkout
        run: git checkout -B "${{ github.event.workflow_run.head_branch || github.ref_name }}"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Derive build/test status from the Verify Setup run
        id: derive
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --paginate > jobs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("jobs.json") as f:
              jobs = json.load(f)["jobs"]

          def conclusion(name):
              job = next((j for j in jobs if j["name"] == name), None)
              return job["conclusion"] if job else None

          test_status = {"success": "passed", "failure": "failed"}.get(conclusion("verify"), "")
          build_status = {"success": "passed", "failure": "failed"}.get(conclusion("test-build"), "")

          print(f"test_status={test_status}")
          print(f"build_status={build_status}")
          PY

      - name: Collect and sync deterministic state
        if: always()
        run: |
          set -euo pipefail
          args=(--ci --build-run-id "${{ github.event.workflow_run.id || github.run_id }}")
          if [ -n "${{ steps.derive.outputs.build_status }}" ]; then
            args+=(--build-status "${{ steps.derive.outputs.build_status }}")
          fi
          if [ -n "${{ steps.derive.outputs.test_status }}" ]; then
            args+=(--test-status "${{ steps.derive.outputs.test_status }}" --test-summary "bash syntax + ShellCheck (verify.yml)")
          fi
          python3 -m tools.repo_knowledge sync "${args[@]}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: >-
          always() &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.event.workflow_run.head_sha }}"
          git push origin HEAD:main
