# Template for local.properties
#
# NOTE: Gradle requires an ABSOLUTE sdk.dir here (a relative path such as
# "sdk.dir=../sdk" will NOT work). This file is machine-specific and is
# normally gitignored — do not commit it with a real path.
#
# The setup script (scripts/setup.sh) generates a correct local.properties
# automatically. If you are configuring manually, uncomment and adjust:
#
# sdk.dir=/absolute/path/to/android-dev/sdk
